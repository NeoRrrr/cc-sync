[package]
name = "cc-sync"
version = "0.1.6"
edition = "2021"
description = "Local desktop GUI for merging agent Markdown, docs, and skills into multiple agent targets."

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
reqwest = { version = "0.12", features = ["blocking", "json"] }

[features]
default = []
