[package]
name = "cc-sync"
version = "0.1.2"
edition = "2021"
description = "Local desktop GUI for merging agent Markdown, docs, and skills into multiple agent targets."

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"

[features]
default = []
