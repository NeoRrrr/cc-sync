<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 100 100">
  <!-- App tile -->
  <rect x="6" y="6" width="88" height="88" rx="22" fill="#ea580c"/>
  <!-- subtle depth on tile bottom -->
  <rect x="6" y="56" width="88" height="38" rx="22" fill="#c2410c" opacity="0.30"/>

  <!-- Back (source) square: white outline, offset up-left -->
  <rect x="26" y="24" width="34" height="34" rx="9" fill="none" stroke="#FFFFFF" stroke-width="6"/>

  <!-- Front (mirror) square: solid white, offset down-right -->
  <rect x="42" y="42" width="34" height="34" rx="9" fill="#FFFFFF"/>

  <!-- Glyph inside front square: two stacked bars = mirrored content -->
  <rect x="49" y="51" width="20" height="5" rx="2.5" fill="#ea580c"/>
  <rect x="49" y="62" width="13" height="5" rx="2.5" fill="#ea580c"/>

  <!-- Sync accent dot connecting source to mirror -->
  <circle cx="51" cy="49" r="4.5" fill="#F97316"/>
</svg>
