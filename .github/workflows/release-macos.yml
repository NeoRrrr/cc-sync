name: Release macOS

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v0.1.6. macos-v0.1.6 is also accepted."
        required: true
        type: string
  push:
    tags:
      - "macos-v*"

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS release assets
    runs-on: macos-latest
    steps:
      - name: Resolve tag
        id: release
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            checkout_ref="${{ inputs.tag }}"
          else
            checkout_ref="${GITHUB_REF_NAME}"
          fi

          release_tag="$checkout_ref"
          if [[ "$release_tag" == macos-v* ]]; then
            release_tag="${release_tag#macos-}"
          fi

          echo "checkout_ref=${checkout_ref}" >> "$GITHUB_OUTPUT"
          echo "release_tag=${release_tag}" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.checkout_ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Build macOS package
        run: ./build-macos.sh

      - name: Create release if needed
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.release_tag }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --title "CC Sync $TAG" --notes "macOS release assets for $TAG."

      - name: Upload macOS assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.release_tag }}
        run: gh release upload "$TAG" release-assets/* --clobber
